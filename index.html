<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixa dooba tiki mouse!!</title>
<style>
  :root{ --bg:#fafafa; --card:#ffffff; --text:#222; --muted:#999; --line:#e7e7e7; --green:#30a46c; --accent:#0090ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
         padding:16px 24px;background:#fff;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.4px}
  h2{margin:0 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .head-right{display:flex;align-items:center;gap:8px}
  .status{font-size:12px;color:var(--muted);margin-right:6px}
  button,select,input,textarea{font:inherit;font-size:13px;color:var(--text)}
  button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer}
  button:hover{background:#f3f3f3}
  button:disabled{opacity:.5;cursor:wait}
  button.icon{border:none;background:none;padding:2px 6px;color:var(--muted)}
  button.icon:hover{color:var(--text);background:none}
  #addNoteBtn{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  #addNoteBtn:hover{background:#2b9a65;border-color:#2b9a65}
  main{max-width:1100px;margin:0 auto;padding:24px}
  section{margin-bottom:32px}
  .edit-only{display:none !important}
  body.editing .edit-only{display:flex !important}
  .composer{flex-direction:column;gap:8px;margin-bottom:32px}
  .composer textarea{width:100%;min-height:70px;resize:vertical;padding:12px;border:1px solid var(--line);
                     border-radius:8px;background:#fff;outline:none;font-size:14px;line-height:1.45}
  .composer textarea:focus,.new-folder input:focus{border-color:#bbb}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted)}
  select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
  .zone{min-height:70px;border:1px dashed transparent;border-radius:10px;padding:4px;transition:.15s}
  .zone.over{border-color:#aaa;background:#f0f0f0}

  /* Formatting toolbar */
  .md-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .md-btn{padding:2px 8px;font-size:12px;min-width:28px;line-height:18px;color:#555}
  .md-btn.md-b{font-weight:700}
  .md-btn.md-i{font-style:italic}
  .md-btn.md-s{text-decoration:line-through}
  .note-tools .md-bar{margin-right:auto;gap:2px}
  .note-tools .md-btn{padding:1px 5px;min-width:22px;font-size:11px}
  .md-done{padding:1px 8px;font-size:11px;background:var(--accent);border-color:var(--accent);color:#fff}
  .md-done:hover{background:#0080e0}

  /* Notes */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-flow:dense;
        gap:12px;align-items:start}
  .note{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;
        display:flex;flex-direction:column;gap:8px;min-width:0}
  body.editing .note{cursor:grab}
  body.editing .note.is-editing{cursor:auto;border-color:#b9dcff}
  .note.dragging{opacity:.4}
  .note.resizing{border-color:var(--accent)}
  .note-text{font-size:14px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere}
  .note-text:empty{display:none}
  .note-text a{color:#0969da;text-decoration:underline;word-break:break-all}
  .note-text .md-p,.note-text li{white-space:pre-wrap}
  .note-text .md-gap{height:.8em}
  .note-text ul,.note-text ol{margin:2px 0;padding-left:20px}
  .note-text li{margin:1px 0}
  .note-text li > ul,.note-text li > ol{margin:0}
  .note-text strong{font-weight:700}
  .note-text s{color:#888}
  .note-meta{font-size:11px;color:var(--muted);margin-top:auto;flex-shrink:0}
  .note-tools{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding-right:10px;flex-shrink:0}
  .note-tools select{font-size:11px;padding:2px 4px;margin-right:auto;max-width:120px}
  .note.is-editing .thumbs{flex-shrink:0}
  /* CHANGED: editor fills exactly the space left in the locked note and scrolls inside if needed */
  .note-edit{display:block;width:100%;margin:0;padding:0;border:none;border-radius:3px;background:transparent;
             font:inherit;font-size:14px;line-height:1.45;color:var(--text);resize:none;outline:none;
             flex:1 1 0;min-height:0;overflow-y:auto;
             box-shadow:0 0 0 5px #f2f8ff,0 0 0 6px #b9dcff}
  .note-edit:focus{box-shadow:0 0 0 5px #f2f8ff,0 0 0 6px var(--accent)}
  .empty{color:var(--muted);font-size:12px;padding:14px 4px}

  /* Note resize handles */
  .rz{position:absolute;z-index:2;touch-action:none}
  .rz-r{top:12px;bottom:16px;right:-6px;width:12px;cursor:ew-resize}
  .rz-b{left:12px;right:16px;bottom:-6px;height:12px;cursor:ns-resize}
  .rz-c{right:-6px;bottom:-6px;width:18px;height:18px;cursor:nwse-resize}
  .rz-r::after,.rz-b::after{content:"";position:absolute;border-radius:3px;background:#cfcfcf;opacity:0;
                            transition:opacity .15s,background .15s}
  .rz-r::after{left:4px;top:50%;width:4px;height:30px;margin-top:-15px}
  .rz-b::after{top:4px;left:50%;height:4px;width:30px;margin-left:-15px}
  .rz-c::after{content:"";position:absolute;right:6px;bottom:6px;width:9px;height:9px;opacity:0;
               border-right:2px solid #bbb;border-bottom:2px solid #bbb;border-bottom-right-radius:4px;
               transition:opacity .15s,border-color .15s}
  .note:hover .rz::after,.note.resizing .rz::after{opacity:1}
  .rz-r:hover::after,.rz-b:hover::after,.rz-r.active::after,.rz-b.active::after{background:var(--accent)}
  .rz-c:hover::after,.rz-c.active::after{border-color:var(--accent)}
  @media (hover:none){ .rz::after{opacity:.8} }
  .rz-ghost{position:fixed;z-index:40;pointer-events:none;border:2px dashed var(--accent);border-radius:8px;
            background:rgba(0,144,255,.06);transition:width .12s ease}
  .rz-ghost span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;
                 padding:2px 8px;border-radius:10px;white-space:nowrap}
  body.rz-active{-webkit-user-select:none;user-select:none}
  body.rz-active *{cursor:inherit !important}

  /* Images */
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
  .thumbs:empty{display:none}
  .thumb{position:relative;min-width:0;flex:0 0 auto;width:calc(50% - 3px);max-width:100%}
  .note.wide .thumb{width:calc(33.333% - 4px)}
  .thumbs.one .thumb,.note.wide .thumbs.one .thumb{width:100%}
  .thumb.custom{width:var(--w) !important}
  .thumb img{display:block;width:100%;height:auto;border-radius:6px;
             border:1px solid var(--line);cursor:zoom-in;background:#f3f3f3}
  .thumb.editable:hover img{border-color:var(--accent)}
  .pending .thumb{width:70px}
  .pending .thumb img{height:70px;object-fit:cover}

  .grip{position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;border-radius:50%;z-index:2;
        background:#fff;border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);
        cursor:nwse-resize;touch-action:none;outline:none;opacity:0;transition:opacity .15s,transform .15s}
  .grip::before{content:"";position:absolute;inset:-7px}
  .thumb:hover .grip,.thumb.resizing .grip,.grip:focus{opacity:1}
  .grip:hover,.thumb.resizing .grip{transform:scale(1.2)}
  .grip:focus{box-shadow:0 0 0 3px rgba(0,144,255,.35)}
  @media (hover:none){ .grip{opacity:1} }
  .thumb.resizing img{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .size-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
            background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;display:none}
  .thumb.resizing .size-tag{display:block}

  .thumb .x{position:absolute;top:3px;right:3px;width:18px;height:18px;padding:0;border:none;border-radius:50%;
            background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:18px;cursor:pointer}
  .lightbox{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
            background:rgba(0,0,0,.85);cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:88vw;max-height:88vh;border-radius:6px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.15);
          color:#fff;font-size:28px;width:44px;height:60px;border-radius:8px;cursor:pointer}
  .lb-nav:hover{background:rgba(255,255,255,.3)}
  #lbPrev{left:16px} #lbNext{right:16px}
  .lb-count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#ddd;font-size:12px}

  .new-folder{gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .new-folder input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;outline:none;min-width:180px}
  .swatches{display:flex;gap:5px;align-items:center}
  .swatch{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .swatch.sel{border-color:#222}
  .folders{display:flex;flex-direction:column;gap:12px}
  .folder{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;
          background:linear-gradient(0deg,var(--tint),var(--tint)),#fff}
  .folder.over{outline:2px dashed var(--c);outline-offset:2px}
  .folder.folder-dragging{opacity:.4}
  .folder.drop-before{box-shadow:0 -4px 0 0 var(--accent)}
  .folder.drop-after{box-shadow:0 4px 0 0 var(--accent)}
  .folder-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
  .handle{color:#bbb;cursor:grab;font-size:14px;letter-spacing:-2px;padding:0 2px}
  .handle:hover{color:#555}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0}
  .folder-name{font-weight:600}
  .count{color:var(--muted);font-size:12px}
  .caret{color:var(--muted);width:12px;font-size:10px}
  .folder-tools{margin-left:auto;display:flex;gap:2px;align-items:center}
  .folder-body{padding:0 12px 12px}
  .folder.collapsed .folder-body{display:none}
  .palette{display:none;margin-right:6px}
  .palette.open{display:flex}

  .login-panel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
               background:rgba(0,0,0,.35)}
  .login-panel[hidden]{display:none}
  .login-box{background:#fff;border-radius:10px;padding:20px;width:min(360px,92vw);
             display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .login-box h3{margin:0 0 4px;font-size:15px}
  .login-box label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .login-box input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none}
  .login-box input:focus{border-color:#bbb}
  .lp-msg{font-size:12px;color:#e5484d;min-height:16px}
  .login-box .row{justify-content:flex-end}
</style>
</head>
<body>

<header>
  <h1>pixa dooba tiki mouse!!</h1>
  <div class="head-right">
    <span class="status" id="status"></span>
    <button class="edit-only" id="exportBtn" title="Download a backup copy of all notes">Export</button>
    <button id="authBtn">Owner login</button>
  </div>
</header>

<main>
  <div class="composer edit-only">
    <textarea id="noteInput" placeholder="Jot down an idea, or paste images (Ctrl/Cmd + V)…  Ctrl/Cmd + Enter to add"></textarea>
    <div class="thumbs pending" id="pendingPreview"></div>
    <div class="row">
      <select id="noteTarget"></select>
      <button id="pickImagesBtn" title="Choose one or more images from your computer">Add images</button>
      <button id="addNoteBtn">Add note</button>
      <span class="hint">**bold** · *italic* · ~~strike~~ · "- " or "1. " for lists · drag a note's edge or corner to resize</span>
    </div>
  </div>

  <section>
    <h2>Loose notes</h2>
    <div class="zone" id="looseZone"><div class="grid" id="looseGrid"></div></div>
  </section>

  <section>
    <h2>Folders</h2>
    <div class="new-folder edit-only">
      <input id="folderInput" placeholder="New folder name">
      <div class="swatches" id="newFolderSwatches"></div>
      <button id="addFolderBtn">Add folder</button>
    </div>
    <div class="folders" id="folders"></div>
  </section>
</main>

<div class="login-panel" id="loginPanel" hidden>
  <div class="login-box">
    <h3>Owner login</h3>
    <label>GitHub username <input id="lpOwner" autocomplete="off" placeholder="e.g. vanessatan"></label>
    <label>Repository name <input id="lpRepo" autocomplete="off" placeholder="e.g. brainstorm"></label>
    <label>Token <input id="lpToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <div class="lp-msg" id="lpMsg"></div>
    <div class="row">
      <button id="lpCancel">Cancel</button>
      <button id="lpGo">Log in</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-nav" id="lbPrev" title="Previous image">‹</button>
  <img id="lightboxImg" alt="">
  <button class="lb-nav" id="lbNext" title="Next image">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* SETTINGS (optional): you can type your username + repo in the login box instead */
const CONFIG = {
  owner:  "",
  repo:   "",
  branch: "main",
  path:   "data.json",
  imageFolder: "images",
  maxImageSide: 1600
};

if (!CONFIG.owner) CONFIG.owner = localStorage.getItem("bs_owner") || "";
if (!CONFIG.repo)  CONFIG.repo  = localStorage.getItem("bs_repo")  || "";

(function autodetect(){
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return;
  if (!CONFIG.owner) CONFIG.owner = host.split(".")[0];
  if (!CONFIG.repo) {
    const seg = location.pathname.split("/").filter(Boolean)[0];
    CONFIG.repo = (seg && !seg.includes(".")) ? seg : host;
  }
})();

const COLORS = {
  red:"#e5484d", orange:"#f76b15", yellow:"#f5c518", green:"#30a46c",
  blue:"#0090ff", indigo:"#3e63dd", violet:"#8e4ec6"
};
const OLD_SIZES = { s: 1, m: 2, l: 3 };
const FOLDER_MIME = "application/x-bs-folder";

let state = { folders: [], notes: [] };
let sha = null;
let token = localStorage.getItem("bs_token") || "";
let editMode = false;
let saveTimer = null, saving = false, pending = false, dirty = false, busy = 0;
let newFolderColor = "blue";
let pendingImages = [];
const localImg = {};
const collapsed = JSON.parse(localStorage.getItem("bs_collapsed") || "{}");
let lb = { list: [], i: 0 };

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const setStatus = t => $("#status").textContent = t;
const fmtDate = ts => new Date(ts).toLocaleString("en-SG",
  { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });

window.addEventListener("error", e => setStatus("Error: " + e.message));

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function iconBtn(label, title, fn){
  const b = el("button", "icon", label);
  b.title = title;
  b.addEventListener("click", e => { e.stopPropagation(); fn(); });
  return b;
}
function normalise(d){
  return { folders: Array.isArray(d && d.folders) ? d.folders : [],
           notes:   Array.isArray(d && d.notes)   ? d.notes   : [] };
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ---------- GitHub storage ---------- */
const apiUrl = p =>
  `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${p || CONFIG.path}`;
const rawUrl = p =>
  `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${p}`;
const ghHeaders = () =>
  ({ "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" });

let ghChain = Promise.resolve();
function ghQueue(fn){
  const p = ghChain.then(fn, fn);
  ghChain = p.catch(() => {});
  return p;
}

async function loadPublic(){
  try {
    const r = await fetch(CONFIG.path + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) state = normalise(await r.json());
  } catch (e) { /* no data yet */ }
}

async function loadFromGitHub(){
  const r = await fetch(apiUrl() + "?ref=" + CONFIG.branch, { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 404) { sha = null; return; }
  if (!r.ok) throw new Error("Load failed (" + r.status + ")");
  const j = await r.json();
  sha = j.sha;
  state = normalise(JSON.parse(b64decode(j.content)));
}

async function saveToGitHub(retry = true){
  setStatus("Saving…");
  const body = {
    message: "Update notes " + new Date().toISOString(),
    content: b64encode(JSON.stringify(state, null, 2)),
    branch: CONFIG.branch
  };
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(), {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (r.ok) {
    sha = (await r.json()).content.sha;
    dirty = false;
    setStatus("Saved ✓");
    return;
  }
  if ((r.status === 409 || r.status === 422) && retry) {
    const g = await fetch(apiUrl() + "?ref=" + CONFIG.branch, { headers: ghHeaders(), cache: "no-store" });
    sha = g.ok ? (await g.json()).sha : null;
    return saveToGitHub(false);
  }
  setStatus("Save failed (" + r.status + ") – keep this tab open and try again");
}

async function flushSave(){
  if (saving) { pending = true; return; }
  saving = true;
  try { await ghQueue(() => saveToGitHub()); }
  catch (e) { setStatus("Offline – changes not saved yet"); }
  finally {
    saving = false;
    if (pending) { pending = false; flushSave(); }
  }
}

function scheduleSave(){
  dirty = true;
  setStatus("Unsaved changes…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 1200);
}
function changed(){
  render();
  scheduleSave();
}

window.addEventListener("beforeunload", e => {
  if (dirty || busy) { e.preventDefault(); e.returnValue = ""; }
});

/* ---------- Images ---------- */
function readAsDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}
function loadImage(src){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

async function prepareImage(file){
  const dataUrl = await readAsDataURL(file);
  const img = await loadImage(dataUrl);
  const max = CONFIG.maxImageSide;
  if (file.size > 1000000 || img.width > max || img.height > max) {
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return { dataUrl: c.toDataURL("image/jpeg", 0.85), ext: "jpg" };
  }
  const ext = (file.type.split("/")[1] || "png").replace("jpeg", "jpg").replace("svg+xml", "svg");
  return { dataUrl, ext };
}

function imagesFromClipboard(e){
  const cd = e.clipboardData;
  if (!cd) return [];
  let files = [...(cd.files || [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) {
    files = [...(cd.items || [])]
      .filter(i => i.kind === "file" && i.type.startsWith("image/"))
      .map(i => i.getAsFile()).filter(Boolean);
  }
  return files;
}

async function uploadImage(prepared){
  const path = `${CONFIG.imageFolder}/${uid()}.${prepared.ext}`;
  const r = await ghQueue(() => fetch(apiUrl(path), {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({
      message: "Add image " + path,
      content: prepared.dataUrl.split(",")[1],
      branch: CONFIG.branch
    })
  }));
  if (!r.ok) throw new Error("Image upload failed (" + r.status + ")");
  localImg[path] = prepared.dataUrl;
  return path;
}

function deleteImage(path){
  return ghQueue(async () => {
    try {
      const g = await fetch(apiUrl(path) + "?ref=" + CONFIG.branch, { headers: ghHeaders(), cache: "no-store" });
      if (!g.ok) return;
      await fetch(apiUrl(path), {
        method: "DELETE",
        headers: { ...ghHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Remove image " + path, sha: (await g.json()).sha, branch: CONFIG.branch })
      });
    } catch (e) { /* leaving an unused image behind is harmless */ }
  });
}

async function uploadAll(prepared){
  busy++;
  const paths = [];
  try {
    for (let i = 0; i < prepared.length; i++) {
      setStatus(`Uploading image ${i + 1} of ${prepared.length}…`);
      paths.push(await uploadImage(prepared[i]));
    }
  } finally { busy--; }
  return paths;
}

async function prepareAll(files){
  const out = [];
  for (const f of files) {
    try { out.push(await prepareImage(f)); }
    catch (e) { setStatus("One image could not be read and was skipped."); }
  }
  return out;
}

/* ---------- Lightbox ---------- */
function openLightbox(list, i){
  lb = { list, i };
  showLightbox();
  $("#lightbox").classList.add("open");
}
function showLightbox(){
  $("#lightboxImg").src = lb.list[lb.i];
  const many = lb.list.length > 1;
  $("#lbPrev").style.display = $("#lbNext").style.display = many ? "" : "none";
  $("#lbCount").textContent = many ? `${lb.i + 1} / ${lb.list.length}` : "";
}
function stepLightbox(d){
  if (lb.list.length < 2) return;
  lb.i = (lb.i + d + lb.list.length) % lb.list.length;
  showLightbox();
}
const closeLightbox = () => $("#lightbox").classList.remove("open");

function beginDragCursor(cursor){
  document.body.classList.add("rz-active");
  document.body.style.cursor = cursor;
}
function endDragCursor(){
  document.body.classList.remove("rz-active");
  document.body.style.cursor = "";
}

function fillThumbs(box, sources, onRemove, fallbacks, opts){
  opts = opts || {};
  box.innerHTML = "";
  box.classList.toggle("one", sources.length === 1);
  sources.forEach((src, i) => {
    const wrap = el("div", "thumb");
    const w = opts.widths && opts.widths[i];
    if (w) { wrap.classList.add("custom"); wrap.style.setProperty("--w", w + "%"); }
    const img = el("img");
    img.src = src;
    img.alt = "";
    img.loading = "lazy";
    img.draggable = false;
    const fb = fallbacks && fallbacks[i];
    if (fb) img.onerror = () => { if (!img.dataset.f) { img.dataset.f = 1; img.src = fb; } };
    img.addEventListener("click", e => {
      e.stopPropagation();
      if (wrap.dataset.justResized) return;
      const list = [...box.querySelectorAll("img")].map(x => x.src);
      openLightbox(list, i);
    });
    wrap.appendChild(img);
    if (onRemove) {
      const x = el("button", "x", "✕");
      x.title = "Remove image";
      x.addEventListener("click", e => { e.stopPropagation(); onRemove(i); });
      wrap.appendChild(x);
    }
    if (opts.onResize) {
      wrap.classList.add("editable");
      wrap.appendChild(el("div", "size-tag"));
      wrap.appendChild(makeGrip(wrap, box, img, pct => opts.onResize(i, pct)));
    }
    box.appendChild(wrap);
  });
}

/* Image corner handle */
function makeGrip(wrap, box, img, done){
  const g = el("div", "grip");
  g.title = "Drag to resize image · double-click to reset";
  g.tabIndex = 0;
  const tag = wrap.querySelector(".size-tag");
  const MIN = 10, MAX = 100;
  const clamp = v => Math.round(Math.min(MAX, Math.max(MIN, v)) * 10) / 10;
  const apply = pct => {
    wrap.classList.add("custom");
    wrap.style.setProperty("--w", pct + "%");
    if (tag) tag.textContent = Math.round(pct) + "%";
  };
  const currentPct = () => {
    const bw = box.getBoundingClientRect().width || 1;
    return clamp(wrap.getBoundingClientRect().width / bw * 100);
  };
  const reset = () => {
    wrap.classList.remove("custom");
    wrap.style.removeProperty("--w");
    done(null);
  };

  g.addEventListener("dragstart", e => e.preventDefault());
  g.addEventListener("mousedown", e => { e.stopPropagation(); e.preventDefault(); });
  g.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const card = box.closest(".note");
    const wasDraggable = card && card.draggable;
    if (card) card.draggable = false;
    g.setPointerCapture(e.pointerId);

    const startX = e.clientX, startY = e.clientY;
    const W = wrap.getBoundingClientRect().width || 1;
    const H = img.getBoundingClientRect().height || W;
    const boxW = box.getBoundingClientRect().width || 1;
    const hadCustom = wrap.classList.contains("custom");
    const oldW = wrap.style.getPropertyValue("--w");
    wrap.classList.add("resizing");
    beginDragCursor("nwse-resize");
    let pct = null, raf = 0, last = e;
    const lastTap = g._lastTap || 0;

    const update = () => {
      raf = 0;
      const dx = last.clientX - startX, dy = last.clientY - startY;
      if (pct == null && Math.hypot(dx, dy) < 3) return;
      const t = ((W + dx) * W + (H + dy) * H) / (W * W + H * H);
      let p = clamp(W * t / boxW * 100);
      if (p >= 97) p = 100;
      pct = p;
      apply(p);
    };
    const move = ev => { last = ev; if (!raf) raf = requestAnimationFrame(update); };
    const up = () => {
      if (raf) { cancelAnimationFrame(raf); update(); }
      g.removeEventListener("pointermove", move);
      g.removeEventListener("pointerup", up);
      g.removeEventListener("pointercancel", up);
      wrap.classList.remove("resizing");
      endDragCursor();
      if (card) card.draggable = wasDraggable;
      if (pct == null) {
        if (!hadCustom) { wrap.classList.remove("custom"); wrap.style.removeProperty("--w"); }
        else wrap.style.setProperty("--w", oldW);
        const now = Date.now();
        g._lastTap = now;
        if (now - lastTap < 350) { g._lastTap = 0; reset(); }
        return;
      }
      wrap.dataset.justResized = 1;
      setTimeout(() => delete wrap.dataset.justResized, 300);
      done(pct);
    };
    g.addEventListener("pointermove", move);
    g.addEventListener("pointerup", up);
    g.addEventListener("pointercancel", up);
  });
  g.addEventListener("click", e => e.stopPropagation());
  g.addEventListener("dblclick", e => { e.stopPropagation(); reset(); });
  g.addEventListener("keydown", e => {
    const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (step) {
      e.preventDefault(); e.stopPropagation();
      const p = clamp(currentPct() + step);
      apply(p);
      done(p);
    } else if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault(); e.stopPropagation();
      reset();
    }
  });
  return g;
}

/* ---------- Note sizing ---------- */
const noteSpan = n => Math.max(1, n.span || OLD_SIZES[n.size] || 1);

function gridInfo(grid){
  const cs = getComputedStyle(grid);
  const cols = Math.max(1, cs.gridTemplateColumns.split(" ").filter(Boolean).length);
  const gap = parseFloat(cs.columnGap) || 12;
  const colW = (grid.clientWidth - gap * (cols - 1)) / cols;
  return { cols, gap, colW };
}

function applySpan(card, span){
  const grid = card.parentElement;
  const cols = grid && grid.classList.contains("grid") ? gridInfo(grid).cols : span;
  const s = Math.min(span, cols);
  card.style.gridColumn = "span " + s;
  card.classList.toggle("wide", s >= 2);
}

function fitNotes(){
  document.querySelectorAll(".grid > .note").forEach(card => applySpan(card, +card.dataset.span || 1));
}
let fitTimer;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitNotes, 100); });

/* NEW: lock / unlock a note's exact height */
function lockHeight(card, h){
  const px = Math.round(h) + "px";
  card.style.height = px;
  card.style.minHeight = px;
  card.style.maxHeight = px;
}
function unlockHeight(card){
  card.style.height = "";
  card.style.maxHeight = "";
  card.style.minHeight = "";
}

function makeNoteResizers(card, n){
  return [["r", "Drag to change width"], ["b", "Drag to change height"], ["c", "Drag to resize"]].map(([dir, tip]) => {
    const h = el("div", "rz rz-" + dir);
    h.title = tip + " · double-click to reset";
    h.addEventListener("dragstart", e => e.preventDefault());
    h.addEventListener("mousedown", e => { e.stopPropagation(); e.preventDefault(); });
    h.addEventListener("click", e => e.stopPropagation());
    h.addEventListener("dblclick", e => {
      e.stopPropagation();
      if (card.classList.contains("is-editing")) return;
      delete n.span; delete n.h; delete n.size;
      changed();
    });
    h.addEventListener("pointerdown", e => startNoteResize(e, card, n, dir, h));
    return h;
  });
}

function startNoteResize(e, card, n, dir, handle){
  if (e.button !== 0) return;
  const grid = card.parentElement;
  if (!grid || !grid.classList.contains("grid")) return;
  e.preventDefault();
  e.stopPropagation();
  card.draggable = false;
  handle.setPointerCapture(e.pointerId);

  const editing = card.classList.contains("is-editing");
  const { cols, gap, colW } = gridInfo(grid);
  const rect = card.getBoundingClientRect();

  // Smallest height the note can have (its content height, or 100px while editing)
  let natural;
  if (editing) natural = 100;
  else {
    const saved = [card.style.height, card.style.minHeight, card.style.maxHeight];
    unlockHeight(card);
    natural = card.getBoundingClientRect().height;
    [card.style.height, card.style.minHeight, card.style.maxHeight] = saved;
  }

  const startX = e.clientX, startY = e.clientY;
  let span = Math.min(+card.dataset.span || 1, cols);
  let hgt = rect.height, moved = false, raf = 0, last = e, ended = false;

  const ghost = el("div", "rz-ghost");
  const label = el("span");
  ghost.appendChild(label);
  ghost.hidden = true;
  document.body.appendChild(ghost);
  card.classList.add("resizing");
  handle.classList.add("active");
  beginDragCursor(getComputedStyle(handle).cursor);

  const update = () => {
    raf = 0;
    const dx = last.clientX - startX, dy = last.clientY - startY;
    if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    moved = true;
    ghost.hidden = false;
    const r = card.getBoundingClientRect();
    let w = r.width;
    if (dir !== "b") {
      span = Math.min(cols, Math.max(1, Math.round((rect.width + dx + gap) / (colW + gap))));
      w = span * colW + (span - 1) * gap;
    }
    if (dir !== "r") hgt = Math.max(natural, rect.height + dy);
    ghost.style.left = r.left + "px";
    ghost.style.top = r.top + "px";
    ghost.style.width = w + "px";
    ghost.style.height = hgt + "px";
    const parts = [];
    if (dir !== "b") parts.push(span + (span > 1 ? " columns" : " column"));
    if (dir !== "r") parts.push(!editing && hgt <= natural + 4 ? "auto height" : Math.round(hgt) + "px tall");
    label.textContent = parts.join(" · ");
  };
  const move = ev => { last = ev; if (!raf) raf = requestAnimationFrame(update); };
  const finish = commit => {
    if (ended) return;
    ended = true;
    if (raf) { cancelAnimationFrame(raf); if (commit) update(); }
    handle.removeEventListener("pointermove", move);
    handle.removeEventListener("pointerup", onUp);
    handle.removeEventListener("pointercancel", onCancel);
    window.removeEventListener("keydown", onKey, true);
    ghost.remove();
    card.classList.remove("resizing");
    handle.classList.remove("active");
    endDragCursor();
    card.draggable = !editing;
    if (!commit || !moved) return;
    n.span = span;
    delete n.size;
    if (dir !== "r") {
      if (!editing && hgt <= natural + 4) delete n.h;
      else n.h = Math.round(hgt);
    }
    card.dataset.span = span;
    applySpan(card, span);
    if (editing) lockHeight(card, dir !== "r" ? hgt : rect.height);   // stays locked at the new size
    else card.style.minHeight = n.h ? n.h + "px" : "";
    scheduleSave();
  };
  const onUp = () => finish(true);
  const onCancel = () => finish(false);
  const onKey = ev => { if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); finish(false); } };
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", onUp);
  handle.addEventListener("pointercancel", onCancel);
  window.addEventListener("keydown", onKey, true);
}

function renderPending(){
  fillThumbs($("#pendingPreview"), pendingImages.map(p => p.dataUrl),
             i => { pendingImages.splice(i, 1); renderPending(); });

async function addToComposer(files){

/* ---------- Markdown (display) ---------- */
const LIST_RE = /^(\s*)([-*+]|\d{1,9}[.)])\s+/;

function makeLink(url){
  const a = el("a", null, url);
  a.href = url.toLowerCase().startsWith("www.") ? "https://" + url : url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.draggable = false;
  a.addEventListener("click", e => e.stopPropagation());
  a.addEventListener("dblclick", e => e.stopPropagation());
  return a;
}

function inlineMd(text){
  const frag = document.createDocumentFragment();
  const re = /\\([\\*_~`\-+.])|(\*\*|__)(?=\S)([\s\S]*?\S)\2|~~(?=\S)([\s\S]*?\S)~~|\*(?=[^\s*])([\s\S]*?[^\s*])\*|_(?=[^\s_])([\s\S]*?[^\s_])_|(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  const isWord = c => !!c && /[A-Za-z0-9]/.test(c);
  let last = 0, m;
  while ((m = re.exec(text))) {
    const usesUnderscore = (m[2] === "__") || m[6] != null;
    if (usesUnderscore && (isWord(text[m.index - 1]) || isWord(text[m.index + m[0].length]))) {
      re.lastIndex = m.index + 1;
      continue;
    }
    frag.append(text.slice(last, m.index));
    if (m[1] != null) frag.append(m[1]);
    else if (m[3] != null) { const s = el("strong"); s.append(inlineMd(m[3])); frag.append(s); }
    else if (m[4] != null) { const s = el("s");      s.append(inlineMd(m[4])); frag.append(s); }
    else if (m[5] != null) { const s = el("em");     s.append(inlineMd(m[5])); frag.append(s); }
    else if (m[6] != null) { const s = el("em");     s.append(inlineMd(m[6])); frag.append(s); }
    else {
      const url = m[7].replace(/[.,!?;:)\]'"*_~]+$/, "");
      frag.append(makeLink(url));
      last = m.index + url.length;
      re.lastIndex = last;
      continue;
    }
    last = re.lastIndex;
  }
  frag.append(text.slice(last));
  return frag;
}

function renderMarkdown(text){
  const frag = document.createDocumentFragment();
  let stack = [];
  const newList = (ordered, num) => {
    const l = el(ordered ? "ol" : "ul");
    if (ordered && num !== 1) l.start = num;
    return l;
  };
  text.split("\n").forEach(line => {
    const m = line.match(/^(\s*)([-*+]|(\d{1,9})[.)])\s+(.*)$/);
    if (!m) {
      stack = [];
      if (line.trim()) { const p = el("div", "md-p"); p.append(inlineMd(line)); frag.appendChild(p); }
      else frag.appendChild(el("div", "md-gap"));
      return;
    }
    const indent = m[1].replace(/\t/g, "    ").length;
    const ordered = m[3] != null;
    const num = ordered ? parseInt(m[3], 10) : 1;
    while (stack.length && indent < stack[stack.length - 1].indent) stack.pop();
    let top = stack[stack.length - 1];
    if (top && indent > top.indent) {
      const l = newList(ordered, num);
      (top.list.lastElementChild || top.list).appendChild(l);
      stack.push({ indent, list: l, ordered });
    } else if (!top || top.ordered !== ordered) {
      if (top) stack.pop();
      const parentTop = stack[stack.length - 1];
      const l = newList(ordered, num);
      (parentTop ? (parentTop.list.lastElementChild || parentTop.list) : frag).appendChild(l);
      stack.push({ indent: top ? top.indent : indent, list: l, ordered });
    }
    const li = el("li");
    li.append(inlineMd(m[4]));
    stack[stack.length - 1].list.appendChild(li);
  });
  return frag;
}

/* ---------- Markdown (typing helpers) ---------- */
function replaceRange(ta, start, end, text, selStart, selEnd){
  ta.focus();
  ta.setSelectionRange(start, end);
  let ok = false;
  try { ok = document.execCommand(text ? "insertText" : "delete", false, text); } catch (e) {}
  if (!ok) ta.setRangeText(text, start, end, "end");
  const a = selStart != null ? selStart : start + text.length;
  ta.setSelectionRange(a, selEnd != null ? selEnd : a);
}

function isWrapped(v, s, e, mark){
  const L = mark.length;
  if (v.slice(s - L, s) !== mark || v.slice(e, e + L) !== mark) return false;
  if (mark === "*") {
    const b2 = v.slice(s - 2, s) === "**" && v.slice(e, e + 2) === "**";
    const b3 = v.slice(s - 3, s) === "***" && v.slice(e, e + 3) === "***";
    if (b2 && !b3) return false;
  }
  return true;
}

function wrapSel(ta, mark){
  const v = ta.value;
  let s = ta.selectionStart, e = ta.selectionEnd;
  while (s < e && /\s/.test(v[s])) s++;
  while (e > s && /\s/.test(v[e - 1])) e--;
  const L = mark.length;
  if (isWrapped(v, s, e, mark)) {
    replaceRange(ta, s - L, e + L, v.slice(s, e), s - L, e - L);
    return;
  }
  const sel = v.slice(s, e);
  const selIsBold = mark === "*" && sel.startsWith("**") && !sel.startsWith("***");
  if (sel.length >= 2 * L && sel.startsWith(mark) && sel.endsWith(mark) && !selIsBold) {
    const inner = sel.slice(L, -L);
    replaceRange(ta, s, e, inner, s, s + inner.length);
    return;
  }
  replaceRange(ta, s, e, mark + sel + mark, s + L, s + L + sel.length);
}

function lineBounds(v, s, e){
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  let le = v.indexOf("\n", e);
  if (le < 0) le = v.length;
  return [ls, le];
}

function toggleList(ta, ordered){
  const v = ta.value;
  const [ls, le] = lineBounds(v, ta.selectionStart, ta.selectionEnd);
  const lines = v.slice(ls, le).split("\n");
  const filled = lines.filter(l => l.trim());
  const allSame = filled.length && filled.every(l => {
    const m = l.match(LIST_RE);
    return m && /\d/.test(m[2]) === ordered;
  });
  let k = 0;
  const out = lines.map(l => {
    if (!l.trim()) return lines.length > 1 ? l : (ordered ? "1. " : "- ");
    const stripped = l.replace(LIST_RE, "$1");
    if (allSame) return stripped;
    const ind = stripped.match(/^\s*/)[0];
    k++;
    return ind + (ordered ? k + ". " : "- ") + stripped.slice(ind.length);
  }).join("\n");
  if (lines.length === 1) replaceRange(ta, ls, le, out);
  else replaceRange(ta, ls, le, out, ls, ls + out.length);
}

function continueList(ta){
  const s = ta.selectionStart;
  if (s !== ta.selectionEnd) return false;
  const v = ta.value;
  const [ls, le] = lineBounds(v, s, s);
  const m = v.slice(ls, le).match(/^(\s*)([-*+]|(\d{1,9})([.)]))(\s+)(.*)$/);
  if (!m) return false;
  if (s < ls + m[1].length + m[2].length + m[5].length) return false;
  if (!m[6].trim()) { replaceRange(ta, ls, le, "", ls, ls); return true; }
  const marker = m[3] ? (parseInt(m[3], 10) + 1) + m[4] : m[2];
  replaceRange(ta, s, s, "\n" + m[1] + marker + " ");
  return true;
}

function indentList(ta, outdent){
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const [ls, le] = lineBounds(v, s, e);
  const lines = v.slice(ls, le).split("\n");
  if (!lines.some(l => LIST_RE.test(l))) return false;
  const out = lines.map(l => !LIST_RE.test(l) ? l : outdent ? l.replace(/^( {1,2}|\t)/, "") : "  " + l).join("\n");
  if (lines.length === 1 && s === e) {
    const caret = Math.max(ls, s + out.length - (le - ls));
    replaceRange(ta, ls, le, out, caret);
  } else replaceRange(ta, ls, le, out, ls, ls + out.length);
  return true;
}

function attachMdKeys(ta){
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      let act = null;
      if (!e.shiftKey && k === "b") act = () => wrapSel(ta, "**");
      else if (!e.shiftKey && k === "i") act = () => wrapSel(ta, "*");
      else if (e.shiftKey && k === "x") act = () => wrapSel(ta, "~~");
      else if (e.shiftKey && e.code === "Digit8") act = () => toggleList(ta, false);
      else if (e.shiftKey && e.code === "Digit7") act = () => toggleList(ta, true);
      if (act) { e.preventDefault(); act(); }
      return;
    }
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) { if (continueList(ta)) e.preventDefault(); }
    else if (e.key === "Tab" && !e.altKey) { if (indentList(ta, e.shiftKey)) e.preventDefault(); }
  });
}

function mdToolbar(ta){
  const bar = el("div", "md-bar");
  [
    ["B", "Bold (Ctrl/Cmd + B)", () => wrapSel(ta, "**"), "md-b"],
    ["I", "Italic (Ctrl/Cmd + I)", () => wrapSel(ta, "*"), "md-i"],
    ["S", "Strikethrough (Ctrl/Cmd + Shift + X)", () => wrapSel(ta, "~~"), "md-s"],
    ["•", "Bulleted list (Ctrl/Cmd + Shift + 8)", () => toggleList(ta, false)],
    ["1.", "Numbered list (Ctrl/Cmd + Shift + 7)", () => toggleList(ta, true)]
  ].forEach(([label, title, fn, cls]) => {
    const b = el("button", "md-btn" + (cls ? " " + cls : ""), label);
    b.type = "button";
    b.title = title;
    b.addEventListener("mousedown", e => e.preventDefault());
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); ta.focus(); fn(); });
    bar.appendChild(b);
  });
  return bar;
}

/* ---------- Login / logout ---------- */
function login(){
  $("#lpOwner").value = CONFIG.owner || "";
  $("#lpRepo").value  = CONFIG.repo  || "";
  $("#lpToken").value = "";
  $("#lpMsg").textContent = "";
  $("#loginPanel").hidden = false;
  (CONFIG.owner && CONFIG.repo ? $("#lpToken") : $("#lpOwner")).focus();
}
function closeLogin(){ $("#loginPanel").hidden = true; }

async function doLogin(){
  const owner = $("#lpOwner").value.trim();
  const repo  = $("#lpRepo").value.trim();
  const t     = $("#lpToken").value.trim();
  const msg   = $("#lpMsg");
  if (!owner || !repo || !t) { msg.style.color = ""; msg.textContent = "Please fill in all three boxes."; return; }
  msg.style.color = "var(--muted)";
  msg.textContent = "Checking…";
  $("#lpGo").disabled = true;
  CONFIG.owner = owner; CONFIG.repo = repo; token = t;
  try {
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: ghHeaders() });
    } catch (e) {
      throw new Error("Can't reach GitHub. Your network (e.g. a work network) may be blocking api.github.com – try another network or device.");
    }
    if (r.status === 401) throw new Error("Token not accepted – it may be wrong, expired, or copied with missing characters.");
    if (r.status === 403) throw new Error("GitHub refused access (403). Check the token's permissions, or try again later.");
    if (r.status === 404) throw new Error(`Repository "${owner}/${repo}" not found, or the token wasn't given access to it.`);
    if (!r.ok) throw new Error("GitHub error " + r.status + ". Please try again.");
    const j = await r.json();
    if (j.permissions && j.permissions.push === false)
      throw new Error('This token can only read. Set Contents to "Read and write" when creating the token.');
    localStorage.setItem("bs_token", token);
    localStorage.setItem("bs_owner", owner);
    localStorage.setItem("bs_repo", repo);
    await loadFromGitHub();
    closeLogin();
    setEditMode(true);
    setStatus("Editing");
  } catch (e) {
    token = "";
    msg.style.color = "";
    msg.textContent = e.message;
  } finally {
    $("#lpGo").disabled = false;
  }
}

function logout(){
  if ((dirty || busy) && !confirm("You have unsaved changes. Log out anyway?")) return;
  localStorage.removeItem("bs_token");
  token = "";
  pendingImages = [];
  renderPending();
  setEditMode(false);
  setStatus("");
}

function setEditMode(on){
  editMode = on;
  $("#authBtn").textContent = on ? "Log out" : "Owner login";
  render();
}

/* ---------- Actions ---------- */
async function addNote(){
  const text = $("#noteInput").value.trim();
  if (!text && !pendingImages.length) return;
  const btn = $("#addNoteBtn");
  btn.disabled = true;
  try {
    const images = await uploadAll(pendingImages);
    const now = Date.now();
    state.notes.push({ id: uid(), text, images,
                       folderId: $("#noteTarget").value || null, created: now, updated: now });
    $("#noteInput").value = "";
    pendingImages = [];
    renderPending();
    changed();
  } catch (e) {
    setStatus(e.message + " – your note was not added, please try again");
  } finally {
    btn.disabled = false;
  }
}

function moveNote(id, folderId){
  const n = state.notes.find(x => x.id === id);
  if (!n || (n.folderId || null) === (folderId || null)) return;
  n.folderId = folderId || null;
  changed();
}

function deleteNote(n){
  if (!confirm("Delete this note?")) return;
  state.notes = state.notes.filter(x => x.id !== n.id);
  (n.images || []).forEach(deleteImage);
  changed();
}

function removeNoteImage(n, i){
  if (!confirm("Remove this image?")) return;
  const path = (n.images || [])[i];
  n.images = (n.images || []).filter((_, k) => k !== i);
  n.updated = Date.now();
  if (path) { deleteImage(path); if (n.imgSizes) delete n.imgSizes[path]; }
  if (!n.text && !n.images.length) state.notes = state.notes.filter(x => x.id !== n.id);
  changed();
}

async function addImagesToNote(n, files, card){
  const prepared = await prepareAll(files);
  if (!prepared.length) return;
  try {
    const paths = await uploadAll(prepared);
    n.images = (n.images || []).concat(paths);
    n.updated = Date.now();
    if (card && card.isConnected) {
      noteThumbs(card.querySelector(".thumbs"), n);
      scheduleSave();
    } else changed();
  } catch (e) {
    setStatus(e.message || "Image could not be added");
  }
}

function addFolder(){
  const name = $("#folderInput").value.trim();
  if (!name) return;
  state.folders.push({ id: uid(), name, color: newFolderColor });
  $("#folderInput").value = "";
  changed();
}

function deleteFolder(f){
  const n = state.notes.filter(x => x.folderId === f.id).length;
  if (!confirm(`Delete folder "${f.name}"?` + (n ? `\nIts ${n} note(s) will move back to Loose notes.` : ""))) return;
  state.notes.forEach(x => { if (x.folderId === f.id) x.folderId = null; });
  state.folders = state.folders.filter(x => x.id !== f.id);
  changed();
}

function renameFolder(f){
  const name = prompt("Rename folder:", f.name);
  if (name && name.trim()) { f.name = name.trim(); changed(); }
}

function shiftFolder(f, d){
  const i = state.folders.indexOf(f), j = i + d;
  if (i < 0 || j < 0 || j >= state.folders.length) return;
  [state.folders[i], state.folders[j]] = [state.folders[j], state.folders[i]];
  changed();
}
function reorderFolder(dragId, targetId, after){
  if (!dragId || dragId === targetId) return;
  const moving = state.folders.find(x => x.id === dragId);
  if (!moving) return;
  const rest = state.folders.filter(x => x.id !== dragId);
  const t = rest.findIndex(x => x.id === targetId);
  if (t < 0) return;
  rest.splice(t + (after ? 1 : 0), 0, moving);
  state.folders = rest;
  changed();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = el("a");
  a.href = URL.createObjectURL(blob);
  a.download = "brainstorm-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function pickImages(onFiles){
  const inp = el("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.multiple = true;
  inp.addEventListener("change", () => { if (inp.files.length) onFiles([...inp.files]); });
  inp.click();
}

/* ---------- Drag & drop ---------- */
const isFolderDrag = e => [...(e.dataTransfer.types || [])].includes(FOLDER_MIME);

function makeDropZone(zone, getFolderId){
  const clearMarks = () => zone.classList.remove("over", "drop-before", "drop-after");
  zone.addEventListener("dragover", e => {
    if (!editMode) return;
    if (isFolderDrag(e)) {
      const fid = getFolderId();
      if (!fid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const r = zone.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      zone.classList.toggle("drop-after", after);
      zone.classList.toggle("drop-before", !after);
      return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    zone.classList.add("over");
  });
  zone.addEventListener("dragleave", e => {
    if (!zone.contains(e.relatedTarget)) clearMarks();
  });
  zone.addEventListener("drop", e => {
    if (!editMode) return;
    e.preventDefault();
    const after = zone.classList.contains("drop-after");
    clearMarks();
    if (isFolderDrag(e)) {
      reorderFolder(e.dataTransfer.getData(FOLDER_MIME), getFolderId(), after);
      return;
    }
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveNote(id, getFolderId());
  });
}

/* ---------- Rendering ---------- */
function swatchRow(current, onPick){
  const wrap = el("div", "swatches");
  Object.entries(COLORS).forEach(([name, hex]) => {
    const s = el("button", "swatch" + (name === current ? " sel" : ""));
    s.style.background = hex;
    s.title = name;
    s.addEventListener("click", e => { e.stopPropagation(); onPick(name); });
    wrap.appendChild(s);
  });
  return wrap;
}

function noteThumbs(box, n){
  const paths = n.images || [];
  const widths = paths.map(p => (n.imgSizes || {})[p]);
  fillThumbs(box, paths.map(p => localImg[p] || p),
             editMode ? i => removeNoteImage(n, i) : null,
             CONFIG.owner ? paths.map(rawUrl) : null,
             { widths, onResize: editMode ? (i, pct) => setImageSize(n, paths[i], pct) : null });
}

function setImageSize(n, path, pct){
  n.imgSizes = n.imgSizes || {};
  if (pct == null) delete n.imgSizes[path];
  else n.imgSizes[path] = pct;
  if (!Object.keys(n.imgSizes).length) delete n.imgSizes;
  scheduleSave();
}

function noteEl(n){
  const span = noteSpan(n);
  const card = el("div", "note" + (span >= 2 ? " wide" : ""));
  card.dataset.span = span;
  card.style.gridColumn = "span " + span;
  if (n.h) card.style.minHeight = n.h + "px";
  const txt = el("div", "note-text");
  if (n.text) txt.append(renderMarkdown(n.text));
  const imgs = el("div", "thumbs");
  card.append(imgs, txt, el("div", "note-meta", fmtDate(n.updated || n.created)));
  noteThumbs(imgs, n);
  if (!editMode) return card;

  card.draggable = true;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", n.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));

  const move = el("select");
  move.title = "Move to folder";
  move.append(new Option("Move to…", ""), new Option("Loose notes", "__loose"));
  state.folders.forEach(f => move.append(new Option(f.name, f.id)));
  move.addEventListener("change", () => {
    if (move.value) moveNote(n.id, move.value === "__loose" ? null : move.value);
  });

  const tools = el("div", "note-tools");
  const pencil = iconBtn("✎", "Edit note (you can paste more images while editing)", () => editNote(card, n));
  pencil.addEventListener("mousedown", e => e.preventDefault());   // no focus jump before the size is locked
  tools.append(
    move,
    iconBtn("🖼", "Add images to this note", () => pickImages(files => addImagesToNote(n, files, card))),
    pencil,
    iconBtn("✕", "Delete note", () => deleteNote(n))
  );
  card.appendChild(tools);
  card.append(...makeNoteResizers(card, n));
  txt.addEventListener("dblclick", () => editNote(card, n));
  return card;
}

/* CHANGED: the note is locked to its EXACT current size the moment you press the pencil.
   The editor fills the space where the text was and scrolls inside if you type more. */
function editNote(card, n){
  const txtEl = card.querySelector(".note-text");
  if (!txtEl || card.classList.contains("is-editing")) return;

  // 1. Measure and lock the exact height BEFORE anything changes
  const cardH = card.getBoundingClientRect().height;
  lockHeight(card, cardH);
  card.draggable = false;
  card.classList.add("is-editing");

  // 2. Editor goes exactly where the text was
  const ta = el("textarea", "note-edit");
  ta.value = n.text || "";
  ta.placeholder = "Type here… (paste images too)";
  txtEl.replaceWith(ta);
  attachMdKeys(ta);

  // 3. Formatting buttons + Done replace the bottom tools row (no extra space used)
  const tools = card.querySelector(".note-tools");
  const doneBtn = el("button", "md-done", "Done");
  doneBtn.type = "button";
  doneBtn.title = "Finish editing (Ctrl/Cmd + Enter)";
  doneBtn.addEventListener("mousedown", e => e.preventDefault());
  if (tools) {
    [...tools.children].forEach(c => c.style.display = "none");
    tools.prepend(mdToolbar(ta));
    tools.append(doneBtn);
  }

  ta.focus({ preventScroll: true });
  ta.setSelectionRange(ta.value.length, ta.value.length);
  let done = false, uploading = 0;

  ta.addEventListener("paste", async e => {
    const files = imagesFromClipboard(e);
    if (!files.length) return;
    e.preventDefault();
    e.stopPropagation();
    uploading++;
    try { await addImagesToNote(n, files, card); }
    finally {
      uploading--;
      if (!done) ta.focus({ preventScroll: true });
    }
  });

  const finish = () => {
    if (done || uploading) return;
    done = true;
    unlockHeight(card);
    const v = ta.value.trim();
    if (v !== (n.text || "") && (v || (n.images || []).length)) { n.text = v; n.updated = Date.now(); changed(); }
    else render();
  };
  doneBtn.addEventListener("click", e => { e.stopPropagation(); finish(); });
  ta.addEventListener("blur", finish);
  ta.addEventListener("keydown", e => {
    if (e.key === "Escape") { ta.value = n.text || ""; finish(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) finish();
  });
}

function folderEl(f, idx){
  const hex = COLORS[f.color] || COLORS.blue;
  const box = el("div", "folder" + (collapsed[f.id] ? " collapsed" : ""));
  box.style.setProperty("--c", hex);
  box.style.setProperty("--tint", hex + "12");

  const notes = state.notes.filter(n => n.folderId === f.id).sort((a, b) => b.created - a.created);

  const head = el("div", "folder-head");
  if (editMode) {
    const handle = el("span", "handle", "⋮⋮");
    handle.title = "Drag to move folder";
    head.appendChild(handle);
    head.draggable = true;
    head.addEventListener("dragstart", e => {
      e.stopPropagation();
      e.dataTransfer.setData(FOLDER_MIME, f.id);
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setDragImage(box, 20, 20); } catch (err) {}
      box.classList.add("folder-dragging");
    });
    head.addEventListener("dragend", () => box.classList.remove("folder-dragging"));
  }
  head.append(
    el("span", "caret", collapsed[f.id] ? "▶" : "▼"),
    el("span", "dot"),
    el("span", "folder-name", f.name),
    el("span", "count", "(" + notes.length + ")")
  );
  head.addEventListener("click", () => {
    collapsed[f.id] = !collapsed[f.id];
    localStorage.setItem("bs_collapsed", JSON.stringify(collapsed));
    render();
  });

  if (editMode) {
    const tools = el("div", "folder-tools");
    const palette = swatchRow(f.color, c => { f.color = c; changed(); });
    palette.classList.add("palette");
    palette.addEventListener("click", e => e.stopPropagation());
    const up = iconBtn("↑", "Move folder up", () => shiftFolder(f, -1));
    const down = iconBtn("↓", "Move folder down", () => shiftFolder(f, 1));
    if (idx === 0) up.disabled = true;
    if (idx === state.folders.length - 1) down.disabled = true;
    tools.append(
      palette,
      up, down,
      iconBtn("🎨", "Change colour", () => palette.classList.toggle("open")),
      iconBtn("✎", "Rename folder", () => renameFolder(f)),
      iconBtn("✕", "Delete folder", () => deleteFolder(f))
    );
    head.appendChild(tools);
  }

  const body = el("div", "folder-body");
  const grid = el("div", "grid");
  notes.forEach(n => grid.appendChild(noteEl(n)));
  body.appendChild(notes.length ? grid : el("div", "empty", editMode ? "Empty – drag notes here" : "Empty"));

  box.append(head, body);
  makeDropZone(box, () => f.id);
  return box;
}

function render(){
  document.body.classList.toggle("editing", editMode);

  const folderIds = new Set(state.folders.map(f => f.id));
  const loose = state.notes
    .filter(n => !n.folderId || !folderIds.has(n.folderId))
    .sort((a, b) => b.created - a.created);
  const lg = $("#looseGrid");
  lg.innerHTML = "";
  loose.forEach(n => lg.appendChild(noteEl(n)));
  if (!loose.length) lg.appendChild(el("div", "empty", editMode ? "No loose notes – drop a note here to unfile it" : "No loose notes"));

  const fw = $("#folders");
  fw.innerHTML = "";
  state.folders.forEach((f, i) => fw.appendChild(folderEl(f, i)));
  if (!state.folders.length) fw.appendChild(el("div", "empty", "No folders yet"));

  const sel = $("#noteTarget"), prev = sel.value;
  sel.innerHTML = "";
  sel.append(new Option("Save to: Loose notes", ""));
  state.folders.forEach(f => sel.append(new Option("Save to: " + f.name, f.id)));
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;

  const nf = $("#newFolderSwatches");
  nf.replaceWith(Object.assign(swatchRow(newFolderColor, c => { newFolderColor = c; render(); }),
                               { id: "newFolderSwatches" }));
  fitNotes();
}

/* ---------- Start up ---------- */
$("#noteInput").before(mdToolbar($("#noteInput")));
attachMdKeys($("#noteInput"));

$("#authBtn").addEventListener("click", () => editMode ? logout() : login());
$("#lpGo").addEventListener("click", doLogin);
$("#lpCancel").addEventListener("click", closeLogin);
$("#loginPanel").addEventListener("click", e => { if (e.target.id === "loginPanel") closeLogin(); });
$("#loginPanel").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
  if (e.key === "Escape") closeLogin();
});
$("#addNoteBtn").addEventListener("click", addNote);
$("#noteInput").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) addNote(); });
$("#pickImagesBtn").addEventListener("click", () => pickImages(addToComposer));
$("#addFolderBtn").addEventListener("click", addFolder);
$("#folderInput").addEventListener("keydown", e => { if (e.key === "Enter") addFolder(); });
$("#exportBtn").addEventListener("click", exportData);
$("#lightbox").addEventListener("click", closeLightbox);
$("#lightboxImg").addEventListener("click", e => { e.stopPropagation(); stepLightbox(1); });
$("#lbPrev").addEventListener("click", e => { e.stopPropagation(); stepLightbox(-1); });
$("#lbNext").addEventListener("click", e => { e.stopPropagation(); stepLightbox(1); });
document.addEventListener("keydown", e => {
  if (!$("#lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") stepLightbox(-1);
  if (e.key === "ArrowRight") stepLightbox(1);
});
makeDropZone($("#looseZone"), () => null);

document.addEventListener("paste", e => {
  if (!editMode) return;
  const t = e.target;
  if (t.classList && (t.classList.contains("note-edit") || t.id === "folderInput")) return;
  const files = imagesFromClipboard(e);
  if (!files.length) return;
  e.preventDefault();
  addToComposer(files);
  $("#noteInput").focus();
});

(async function init(){
  await loadPublic();
  if (token && CONFIG.owner && CONFIG.repo) {
    try { await loadFromGitHub(); editMode = true; setStatus("Editing"); }
    catch (e) { setStatus("Viewing (login expired – click Owner login)"); }
  }
  setEditMode(editMode);
})();
</script>
